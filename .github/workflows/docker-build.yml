name: Docker Image CI

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
  schedule:
    - cron: '21 3 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6

      - name: Check KasmVNC base image
        id: check_base_kasmvnc
        uses: lucacome/docker-image-update-checker@v3
        with:
          base-image: lscr.io/linuxserver/baseimage-kasmvnc:ubuntunoble
          image: ${{ secrets.DOCKERHUB_USERNAME }}/beyondcompare:latest

      - name: Check noVNC base image
        id: check_base_novnc
        uses: lucacome/docker-image-update-checker@v3
        with:
          base-image: jlesage/baseimage-gui:ubuntu-24.04-v4
          image: ${{ secrets.DOCKERHUB_USERNAME }}/beyondcompare:novnc

      - name: Check Beyond Compare version
        id: check_app
        run: |
          set -e
          CURRENT=$(docker run --rm ${{ secrets.DOCKERHUB_USERNAME }}/beyondcompare:latest dpkg-query -W -f='${Version}' bcompare 2>/dev/null || echo "none")
          LATEST=$(docker run --rm -e DEBIAN_FRONTEND=noninteractive ubuntu:latest bash -c "apt-get update -qq && apt-get install -y wget gnupg2 -qq > /dev/null && wget -qO /etc/apt/trusted.gpg.d/scootersoftware.asc https://www.scootersoftware.com/DEB-GPG-KEY-scootersoftware.asc && wget -qO /etc/apt/sources.list.d/scootersoftware.list https://www.scootersoftware.com/scootersoftware.list && apt-get update -qq && apt-cache policy bcompare | grep Candidate | awk '{print \$2}'")
          
          if [ "$CURRENT" != "$LATEST" ]; then
            echo "needs_update=true" >> $GITHUB_OUTPUT
            echo "version=$LATEST" >> $GITHUB_OUTPUT
          else
            echo "needs_update=false" >> $GITHUB_OUTPUT
          fi

      - name: Evaluate Build Requirements
        id: eval
        run: |
          BUILD_KASMVNC="false"
          BUILD_NOVNC="false"
          REASON=""
          
          if [ "${{ github.event_name }}" == "push" ] || [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            BUILD_KASMVNC="true"
            BUILD_NOVNC="true"
            REASON="Manual trigger or source code update"
          elif [ "${{ steps.check_app.outputs.needs_update }}" == "true" ]; then
            BUILD_KASMVNC="true"
            BUILD_NOVNC="true"
            REASON="Beyond Compare V ${{ steps.check_app.outputs.version }}"
          else
            if [ "${{ steps.check_base_kasmvnc.outputs.needs-updating }}" == "true" ]; then
              BUILD_KASMVNC="true"
              REASON="Base image (KasmVNC) updated. "
            fi
            if [ "${{ steps.check_base_novnc.outputs.needs-updating }}" == "true" ]; then
              BUILD_NOVNC="true"
              REASON="${REASON}Base image (noVNC) updated."
            fi
          fi
          
          echo "build_kasmvnc=$BUILD_KASMVNC" >> $GITHUB_OUTPUT
          echo "build_novnc=$BUILD_NOVNC" >> $GITHUB_OUTPUT
          echo "reason=$REASON" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        if: steps.eval.outputs.build_kasmvnc == 'true' || steps.eval.outputs.build_novnc == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push KasmVNC
        if: steps.eval.outputs.build_kasmvnc == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./kasmvnc
          push: true
          pull: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/beyondcompare:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/beyondcompare:kasmvnc

      - name: Build and push noVNC
        if: steps.eval.outputs.build_novnc == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./novnc
          push: true
          pull: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/beyondcompare:novnc

      - name: Update Changelog
        if: steps.eval.outputs.build_kasmvnc == 'true' || steps.eval.outputs.build_novnc == 'true'
        run: |
          set -e
          DATE=$(date +'%Y-%m-%d')
          
          if [ ! -f CHANGELOG.md ]; then
            echo "# Changelog" > CHANGELOG.md
            echo "" >> CHANGELOG.md
          fi
          
          {
            echo "-------------"
            echo "$DATE"
            echo "${{ steps.eval.outputs.reason }}"
            echo ""
          } > new_entry.txt
          
          head -n 1 CHANGELOG.md > temp_changelog.md
          cat new_entry.txt >> temp_changelog.md
          tail -n +2 CHANGELOG.md >> temp_changelog.md
          
          head -n 500 temp_changelog.md > CHANGELOG.md
          rm temp_changelog.md new_entry.txt
          
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md
          
          git commit -m "docs: prepend build log for $DATE [skip ci]" || echo "No changes to commit"
          git push
