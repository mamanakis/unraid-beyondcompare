name: Docker Image CI

on:
  push:
    branches: [ "novnc-test" ]
    paths-ignore:
      - 'README.md'
      - '**.md'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - 'README.md'
      - '**.md'
  schedule:
    - cron: '21 3 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6

      # 1. Check if the jlesage base image has updated
      - name: Check base image for updates
        id: check_base
        uses: lucacome/docker-image-update-checker@v3
        with:
          base-image: jlesage/baseimage-gui:ubuntu-24.04-v4
          image: ${{ secrets.DOCKERHUB_USERNAME }}/beyondcompare:novnc

      # 2. Check if Scooter Software published a new bcompare APT package
      - name: Check Beyond Compare version
        id: check_app
        run: |
          set -e
          
          # Check the version currently installed in your published Docker Hub image
          CURRENT=$(docker run --rm ${{ secrets.DOCKERHUB_USERNAME }}/beyondcompare:novnc dpkg-query -W -f='${Version}' bcompare 2>/dev/null || echo "none")
          
          # Query the Scooter Software APT repo for the latest available version
          LATEST=$(docker run --rm ubuntu:noble bash -c "apt-get update -qq && apt-get install -y wget gnupg2 -qq > /dev/null && wget -qO /etc/apt/trusted.gpg.d/scootersoftware.asc https://www.scootersoftware.com/DEB-GPG-KEY-scootersoftware.asc && wget -qO /etc/apt/sources.list.d/scootersoftware.list https://www.scootersoftware.com/scootersoftware.list && apt-get update -qq && apt-cache policy bcompare | grep Candidate | awk '{print \$2}'")
          
          echo "Current image version: $CURRENT"
          echo "Latest APT version: $LATEST"
          
          if [ "$CURRENT" != "$LATEST" ]; then
            echo "needs_update=true" >> $GITHUB_OUTPUT
            echo "change_note=Beyond Compare V $LATEST" >> $GITHUB_OUTPUT
          else
            echo "needs_update=false" >> $GITHUB_OUTPUT
          fi

      # 3. Consolidate the checks to determine if a build is necessary
      - name: Determine if build is required
        id: should_build
        run: |
          set -e
          
          CHANGE_REASON="Manual trigger or source code update"
          
          if [ "${{ steps.check_app.outputs.needs_update }}" == "true" ]; then
            CHANGE_REASON="${{ steps.check_app.outputs.change_note }}"
          elif [ "${{ steps.check_base.outputs.needs-updating }}" == "true" ]; then
            CHANGE_REASON="Base image (jlesage/baseimage-gui) updated"
          fi
          echo "change_reason=$CHANGE_REASON" >> $GITHUB_OUTPUT

          if [ "${{ github.event_name }}" == "push" ] || [ "${{ github.event_name }}" == "workflow_dispatch" ] || [ "${{ steps.check_base.outputs.needs-updating }}" == "true" ] || [ "${{ steps.check_app.outputs.needs_update }}" == "true" ]; then
            echo "run_build=true" >> $GITHUB_OUTPUT
            echo "Update required. Proceeding with build."
          else
            echo "run_build=false" >> $GITHUB_OUTPUT
            echo "No upstream changes detected. Skipping build."
          fi

      # 4. Only execute Docker Hub login and build if run_build is true
      - name: Log in to Docker Hub
        if: steps.should_build.outputs.run_build == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        if: steps.should_build.outputs.run_build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          pull: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/beyondcompare:novnc

      # 5. Prepend to changelog, prune to 500 lines, and commit (Robust POSIX Method)
      - name: Update Changelog
        if: steps.should_build.outputs.run_build == 'true'
        run: |
          set -e # Stop pipeline immediately if any command fails
          
          DATE=$(date +'%Y-%m-%d')
          
          # Initialize the file with the header if it does not exist
          if [ ! -f CHANGELOG.md ]; then
            echo "# Changelog" > CHANGELOG.md
            echo "" >> CHANGELOG.md
          fi
          
          # Write the new entry to a temporary file
          {
            echo "-------------"
            echo "$DATE"
            echo "${{ steps.should_build.outputs.change_reason }}"
            echo ""
          } > new_entry.txt
          
          # 1. Extract the first line (# Changelog)
          head -n 1 CHANGELOG.md > temp_changelog.md
          
          # 2. Append the new entry below the title
          cat new_entry.txt >> temp_changelog.md
          
          # 3. Append the rest of the original file (starting from line 2)
          tail -n +2 CHANGELOG.md >> temp_changelog.md
          
          # 4. Prune to 500 lines and overwrite the original
          head -n 500 temp_changelog.md > CHANGELOG.md
          rm temp_changelog.md new_entry.txt
          
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md
          
          git commit -m "docs: prepend build log for $DATE [skip ci]" || echo "No changes to commit"
          git push
